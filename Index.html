
<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: linear-gradient(135deg, #10172e, #553c9a);
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 100px 20px;
}
button {
  padding: 16px 25px;
  background: #7dd3fc;
  border: none;
  border-radius: 15px;
  font-size: 18px;
  cursor: pointer;
}
#letter { display: none; }
</style>
</head>
<body>
<h1>💻 Happy Coding Day! 🎉</h1>
<p>A special surprise for my amazing teacher ❤️</p>
<button onclick="document.getElementById('letter').style.display='block'">
  Open Your Surprise 💌
</button>
<div id="letter">
  <h2>Dear Teacher 💙</h2>
  <p>Happy Coding Day!</p>
  <p>Thank you for teaching us, inspiring us, and helping us learn.</p>
  <p>May your code always work and your bugs disappear! 😂</p>
  <h3>With appreciation, Your Student ❤️</h3>
</div>
</body>
</html>
